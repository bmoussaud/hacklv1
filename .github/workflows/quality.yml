name: Quality and Lighthouse

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Lighthouse audit
        run: npm run audit
      - name: Retain Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          include-hidden-files: true
          if-no-files-found: warn
      - name: Retain browser checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: test-results
          if-no-files-found: warn
